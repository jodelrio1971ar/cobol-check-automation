name: COBOL Check Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cobol-check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Preparar permisos
        run: |
          chmod +x .github/scripts/run_cobolcheck.sh
          chmod +x cobol-check/scripts/linux_gnucobol_run_tests

      - name: Ejecutar pruebas COBOL Check
        run: |
          .github/scripts/run_cobolcheck.sh EMPPAY
          .github/scripts/run_cobolcheck.sh DEPTPAY
